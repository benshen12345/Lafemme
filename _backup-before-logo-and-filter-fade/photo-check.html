<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>LaFemme — 照片对齐自检</title>
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
<link rel="preload" as="script" href="vendor/supabase.js" />
<style>
  :root{ --ink:#1C1A17; --muted:#6E675C; --hairline:#E6DFD3; --panel:#F3EEE5; --gold:#C6A15B; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:#FAF7F2;color:var(--ink);
       max-width:1180px;margin:0 auto;padding:34px 20px 80px;line-height:1.6}
  h1{font-weight:500;font-size:26px;margin-bottom:4px}
  .sub{color:var(--muted);margin-bottom:22px;font-size:14.5px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  button{font:inherit;font-size:13px;padding:9px 16px;border:1px solid var(--hairline);border-radius:8px;
         background:#fff;color:var(--ink);cursor:pointer}
  button.primary{background:var(--ink);color:#FAF7F2;border-color:var(--ink)}
  button:disabled{opacity:.5;cursor:default}
  #prog{font-size:13px;color:var(--muted)}
  .card{border:1px solid var(--hairline);background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .big{font-size:34px;font-weight:600;line-height:1.1}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{padding:8px 8px;border-bottom:1px solid var(--hairline);text-align:left;vertical-align:top}
  th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.bad td{background:#FBE9E7}
  tr.warn td{background:#FCF3E3}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .t-bad{background:#F6D2CC;color:#8E2F1F}
  .t-warn{background:#F2E2BE;color:#7A5A16}
  .t-ok{background:#DFEDE4;color:#2F6B48}
  code{background:var(--panel);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .note{background:var(--panel);border-left:3px solid var(--gold);padding:14px 16px;border-radius:0 8px 8px 0;margin:18px 0;font-size:14px}
  .thumbs{display:flex;gap:6px;align-items:flex-start}
  .thumbs canvas{border:1px solid var(--hairline);width:52px;height:78px;display:block}
  .cap{font-size:10px;color:var(--muted);text-align:center}
  #out textarea{width:100%;height:170px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
                border:1px solid var(--hairline);border-radius:8px;padding:10px;background:#fff}
</style>
</head>
<body>

<h1>照片对齐自检</h1>
<p class="sub">
  逐件比对每张礼服的<b>缩略图</b>和<b>大图</b>。点开弹窗时先显示缩略图、大图下载完再替换 ——
  如果两张图的<b>比例</b>或<b>构图</b>对不上,替换的一瞬间照片就会动一下。
  这个页面把会动的挑出来,并告诉你在弹窗里会动几个像素。
</p>

<div class="bar">
  <button id="run" class="primary">开始检查</button>
  <button id="csv" disabled>复制结果</button>
  <span id="prog"></span>
</div>

<div id="summary"></div>
<div id="result"></div>
<div id="out"></div>

<script src="catalogue.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* 和 index.html 用同一套配置,这样查的就是线上真实数据 */
const SB_URL = "https://djrnozqgrkpbxoaebaeo.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcm5venFncmtwYnhvYWViYWVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MjI5ODcsImV4cCI6MjA5OTQ5ODk4N30.GRak9yFiaknsX5WVxQ_Zue70k5m-zOrpXcb2vBut5tA";

/* 弹窗照片框:笔记本上实测约 427×640,比例 2:3。用它来把误差换算成「屏幕上动几像素」 */
const BOX_W = 427, BOX_H = 640;
const BOX_AR = BOX_W / BOX_H;
/* 构图比对用的小画布 —— 够看出位移,又不至于跑很久 */
const CMP_W = 120, CMP_H = 180, SEARCH = 6;

const $ = s => document.querySelector(s);
let ROWS = [];

async function getCatalogue(){
  let styles = (typeof STYLES !== "undefined" && Array.isArray(STYLES)) ? STYLES : [];
  try {
    if (typeof supabase !== "undefined") {
      const sb = supabase.createClient(SB_URL, SB_KEY);
      const { data, error } = await sb.from("products")
        .select("id,gender,prefix,name,variants,added_at").order("added_at", { ascending: false });
      if (!error && Array.isArray(data) && data.length) {
        styles = data.map(r => ({ i:r.id, g:r.gender, p:r.prefix, n:r.name, v:r.variants || [] }));
        return { styles, live: true };
      }
    }
  } catch (e) {}
  return { styles, live: false };
}

function load(src){
  return new Promise(res => {
    const im = new Image();
    im.crossOrigin = "anonymous";          /* 让 canvas 能读像素;跨域没开 CORS 就退回只比比例 */
    im.onload  = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}

/* 把图按 object-fit:cover + object-position:center top 画进一个 2:3 的小框 —— 和浏览器一样 */
function draw(im, w, h){
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  const s = Math.max(w / im.naturalWidth, h / im.naturalHeight);
  const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  g.drawImage(im, (w - dw) / 2, 0, dw, dh);      /* center 横向,top 纵向 */
  return c;
}

function grey(c){
  const g = c.getContext("2d", { willReadFrequently: true });
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const out = new Float32Array(c.width * c.height);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) out[j] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
  return out;
}

/* 在 ±SEARCH 像素内找「把大图挪多少能和缩略图最像」。挪 0 才对,挪了就是构图不一样 */
function bestOffset(a, b, w, h){
  const m = 18;
  let best = { d: Infinity, dx: 0, dy: 0 }, zero = 0;
  for (let dy = -SEARCH; dy <= SEARCH; dy++){
    for (let dx = -SEARCH; dx <= SEARCH; dx++){
      let sum = 0, n = 0;
      for (let y = m; y < h - m; y += 2){
        const ay = y * w, by = (y + dy) * w;
        for (let x = m; x < w - m; x += 2){ sum += Math.abs(a[ay + x] - b[by + x + dx]); n++; }
      }
      const d = sum / n;
      if (dx === 0 && dy === 0) zero = d;
      if (d < best.d) best = { d, dx, dy };
    }
  }
  return { ...best, zero };
}

/* 比例差会让 cover 的缩放不一样 → 边缘内容在屏幕上挪几像素 */
function ratioShiftPx(arT, arH){
  const px = ar => {
    if (ar > BOX_AR){ const w = BOX_H * ar; return { off: (w - BOX_W) / 2, axis: "横" }; }  /* 按高缩放,左右裁 */
    const h = BOX_W / ar; return { off: 0, axis: "纵" };                                     /* 按宽缩放,顶部对齐,不位移 */
  };
  const a = px(arT), b = px(arH);
  return Math.abs(a.off - b.off);
}

async function run(){
  $("#run").disabled = true;
  $("#result").innerHTML = ""; $("#summary").innerHTML = ""; $("#out").innerHTML = "";
  $("#prog").textContent = "读取目录…";

  const { styles, live } = await getCatalogue();
  const items = [];
  styles.forEach(st => (st.v || []).forEach(v => {
    if (v && v.img && v.hi && v.hi !== v.img) items.push({ name: st.n || st.i, colour: v.c || "", img: v.img, hi: v.hi });
  }));

  ROWS = [];
  let tainted = 0;
  for (let k = 0; k < items.length; k++){
    const it = items[k];
    $("#prog").textContent = `检查中… ${k + 1} / ${items.length}　${it.name} ${it.colour}`;
    const [a, b] = await Promise.all([load(it.img), load(it.hi)]);
    if (!a || !b){ ROWS.push({ ...it, err: "图片加载失败" }); continue; }

    const arT = a.naturalWidth / a.naturalHeight, arH = b.naturalWidth / b.naturalHeight;
    const arDiff = Math.abs(arH - arT) / arT * 100;
    const row = { ...it,
      wT: a.naturalWidth, hT: a.naturalHeight, wH: b.naturalWidth, hH: b.naturalHeight,
      arT, arH, arDiff, ratioPx: ratioShiftPx(arT, arH), dx: null, dy: null };

    try {
      const ca = draw(a, CMP_W, CMP_H), cb = draw(b, CMP_W, CMP_H);
      const off = bestOffset(grey(ca), grey(cb), CMP_W, CMP_H);
      /* 只有「挪了明显更像」才算构图不同,否则就是清晰度差异 */
      const real = (off.dx !== 0 || off.dy !== 0) && off.d < off.zero * 0.92;
      row.dx = real ? off.dx : 0; row.dy = real ? off.dy : 0;
      row.framePx = Math.round(Math.hypot(row.dx * (BOX_W / CMP_W), row.dy * (BOX_H / CMP_H)));
      row.canvasA = ca; row.canvasB = cb;
    } catch (e) { tainted++; row.dx = row.dy = null; }   /* 跨域没开 CORS → 只比比例 */

    row.shiftPx = Math.max(row.ratioPx, row.framePx || 0);
    ROWS.push(row);
    if (k % 6 === 0) await new Promise(r => setTimeout(r, 0));
  }

  $("#prog").textContent = "";
  render(live, items.length, tainted);
  $("#csv").disabled = false;
  $("#run").disabled = false;
}

function verdict(r){
  if (r.err) return ["t-warn", "读不到"];
  if (r.shiftPx >= 4) return ["t-bad", "会动"];
  if (r.shiftPx >= 1.5) return ["t-warn", "轻微"];
  return ["t-ok", "不动"];
}

function render(live, total, tainted){
  const rows = ROWS.slice().sort((a, b) => (b.shiftPx || 0) - (a.shiftPx || 0));
  const bad  = rows.filter(r => !r.err && r.shiftPx >= 4);
  const warn = rows.filter(r => !r.err && r.shiftPx >= 1.5 && r.shiftPx < 4);
  const err  = rows.filter(r => r.err);

  $("#summary").innerHTML =
    `<div class="card"><div class="kpis">
       <div><div class="lbl">检查了</div><div class="big">${total}</div><div class="sub" style="margin:0">张照片(${live ? "线上目录" : "本地 catalogue.js"})</div></div>
       <div><div class="lbl">会动</div><div class="big" style="color:${bad.length ? "#A33A2B" : "#2F6B48"}">${bad.length}</div><div class="sub" style="margin:0">≥ 4px,肉眼看得出</div></div>
       <div><div class="lbl">轻微</div><div class="big">${warn.length}</div><div class="sub" style="margin:0">1.5–4px</div></div>
       <div><div class="lbl">读不到</div><div class="big">${err.length}</div><div class="sub" style="margin:0">图片 404 或跨域</div></div>
     </div>${tainted ? `<p class="sub" style="margin:12px 0 0">有 ${tainted} 张跨域没开 CORS,只比了比例、没比构图。</p>` : ""}</div>`;

  if (!bad.length && !warn.length && !err.length){
    $("#result").innerHTML = `<div class="note"><b style="color:#2F6B48">全部对齐。</b>
      每张缩略图和它的大图比例、构图都一致,换图时照片不会动。</div>`;
    return;
  }

  const show = rows.filter(r => r.err || r.shiftPx >= 1);
  let html = `<div class="note">下面按「会动几像素」从大到小排。
      <b>比例差</b>是缩略图和大图的宽高比不一样,<b>构图差</b>是两张图裁的位置不一样 ——
      两种都会让换图那一下照片跳一下。<br>
      修法都一样:<b>用同一张原图、同一个裁切,重新导一次缩略图和大图</b>。</div>
    <table><thead><tr>
      <th>款式 / 颜色</th><th>缩略图</th><th>大图</th>
      <th class="num">比例差</th><th class="num">构图差</th><th class="num">弹窗里会动</th><th>对比</th><th></th>
    </tr></thead><tbody>`;
  for (const r of show){
    const [cls, txt] = verdict(r);
    const trc = r.shiftPx >= 4 ? "bad" : (r.shiftPx >= 1.5 ? "warn" : "");
    if (r.err){
      html += `<tr class="warn"><td>${r.name} ${r.colour}</td><td colspan="6"><code>${r.img}</code> / <code>${r.hi}</code></td><td><span class="tag t-warn">读不到</span></td></tr>`;
      continue;
    }
    html += `<tr class="${trc}">
      <td><b>${r.name}</b><br><span class="sub" style="font-size:12px">${r.colour}</span></td>
      <td>${r.wT}×${r.hT}<br><span class="sub" style="font-size:11px">${r.arT.toFixed(4)}</span></td>
      <td>${r.wH}×${r.hH}<br><span class="sub" style="font-size:11px">${r.arH.toFixed(4)}</span></td>
      <td class="num">${r.arDiff.toFixed(2)}%</td>
      <td class="num">${r.dx === null ? "—" : (r.dx || r.dy ? `dx ${r.dx} / dy ${r.dy}` : "0")}</td>
      <td class="num"><b>${r.shiftPx.toFixed(1)}px</b></td>
      <td><div class="thumbs" data-i="${ROWS.indexOf(r)}"></div></td>
      <td><span class="tag ${cls}">${txt}</span></td></tr>`;
  }
  html += `</tbody></table>`;
  $("#result").innerHTML = html;

  document.querySelectorAll(".thumbs").forEach(d => {
    const r = ROWS[+d.dataset.i];
    if (!r || !r.canvasA) return;
    [["缩略", r.canvasA], ["大图", r.canvasB]].forEach(([cap, c]) => {
      const wrap = document.createElement("div");
      const cv = document.createElement("canvas");
      cv.width = c.width; cv.height = c.height;
      cv.getContext("2d").drawImage(c, 0, 0);
      wrap.appendChild(cv);
      const p = document.createElement("div"); p.className = "cap"; p.textContent = cap;
      wrap.appendChild(p); d.appendChild(wrap);
    });
  });

  $("#out").innerHTML = `<p class="lbl" style="margin-top:20px">纯文字结果(方便复制发出去)</p>
    <textarea readonly>${text()}</textarea>`;
}

function text(){
  const rows = ROWS.slice().sort((a, b) => (b.shiftPx || 0) - (a.shiftPx || 0));
  let s = `LaFemme 照片对齐自检 — 共 ${ROWS.length} 张\n`;
  s += `会动(≥4px):${rows.filter(r => !r.err && r.shiftPx >= 4).length}　轻微(1.5–4px):${rows.filter(r => !r.err && r.shiftPx >= 1.5 && r.shiftPx < 4).length}　读不到:${rows.filter(r => r.err).length}\n\n`;
  for (const r of rows){
    if (r.err){ s += `读不到\t${r.name} ${r.colour}\t${r.img}\t${r.hi}\n`; continue; }
    if (r.shiftPx < 1) continue;
    s += `${r.shiftPx.toFixed(1)}px\t${r.name} ${r.colour}\t${r.wT}x${r.hT} -> ${r.wH}x${r.hH}\t比例差 ${r.arDiff.toFixed(2)}%\t构图 dx${r.dx} dy${r.dy}\t${r.hi}\n`;
  }
  return s;
}

$("#run").addEventListener("click", run);
$("#csv").addEventListener("click", () => {
  const t = $("#out textarea"); if (!t) return;
  t.select(); document.execCommand("copy");
  $("#csv").textContent = "已复制 ✓"; setTimeout(() => $("#csv").textContent = "复制结果", 1400);
});
</script>
</body>
</html>
